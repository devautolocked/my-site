<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер задач | autolocked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <a href="../index.html" class="back-link">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Вернуться в портфолио
        </a>

        <div class="todo-card">
            <header class="todo-header">
                <h1>Мои задачи</h1>
                <p class="subtitle">Планируйте день и сохраняйте фокус</p>
            </header>

            <form id="todoForm" class="todo-input-group">
                <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off" required>
                <button type="submit" class="btn-add">Добавить</button>
            </form>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">В процессе</button>
                <button class="filter-btn" data-filter="completed">Завершенные</button>
            </div>

            <ul id="taskList" class="task-list"></ul>

            <footer class="todo-footer">
                <span id="itemsLeft">0 задач осталось</span>
                <button id="clearCompletedBtn" class="btn-clear">Очистить выполненные</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
