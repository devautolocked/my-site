<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют | autolocked.dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <a href="../index.html" class="back-link">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Вернуться в портфолио
        </a>

        <div class="converter-card">
            <div class="card-header">
                <h1 class="title">Конвертер валют</h1>
                <p class="subtitle">Актуальные курсы в реальном времени через Exchange Rate API</p>
            </div>

            <div class="converter-body">
                <!-- Поле "У меня есть" -->
                <div class="input-block">
                    <label for="amountInput">Сумма:</label>
                    <div class="field-row">
                        <input type="number" id="amountInput" value="100" min="0" step="any" placeholder="0.00">
                        <select id="fromCurrency" class="currency-select"></select>
                    </div>
                </div>

                <!-- Кнопка смены валют местами -->
                <button id="swapBtn" class="swap-btn" title="Поменять местами">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                        <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/>
                    </svg>
                </button>

                <!-- Поле "Я получу" -->
                <div class="input-block">
                    <label for="resultOutput">Результат:</label>
                    <div class="field-row">
                        <input type="text" id="resultOutput" readonly placeholder="Загрузка...">
                        <select id="toCurrency" class="currency-select"></select>
                    </div>
                </div>
            </div>

            <!-- Индикатор курса и даты -->
            <div class="rate-info">
                <div id="rateText" class="rate-text">Загрузка актуального курса...</div>
                <div id="lastUpdated" class="updated-text"></div>
            </div>

            <!-- Быстрые популярные курсы -->
            <div class="popular-rates">
                <div class="popular-title">Популярные направления к USD:</div>
                <div class="popular-grid" id="popularGrid"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
